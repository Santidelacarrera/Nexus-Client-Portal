name: showcase
on:
  push:
    paths: ["showcase/**", ".github/workflows/showcase.yml"]
  pull_request:
    paths: ["showcase/**", ".github/workflows/showcase.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: showcase
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci_admin_pw }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_DSN: postgresql://postgres:ci_admin_pw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: showcase/requirements-dev.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: showcase/package-lock.json }
      - run: pip install -r requirements-dev.txt
      - run: npm ci && npm run build
      - run: pytest -q
      - run: npx jest
      - run: npm run lint
      - run: bandit --ini .bandit -r src
      - run: pip-audit -r requirements.txt
      - run: npm audit --omit=dev --audit-level=high
