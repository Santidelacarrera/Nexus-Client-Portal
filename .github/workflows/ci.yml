name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: nexus_owner, POSTGRES_PASSWORD: owner_pw, POSTGRES_DB: nexus_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus_owner" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - name: Unit/integration (SQLite)
        run: pytest -q
      - name: Create unprivileged app role
        run: PGPASSWORD=owner_pw psql -h localhost -U nexus_owner -d nexus_test -c "CREATE ROLE nexus_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'app_pw'"
      - name: Full suite on PostgreSQL with enforced RLS
        env:
          DATABASE_URL: postgresql+psycopg://nexus_app:app_pw@localhost/nexus_test
          DATABASE_ADMIN_URL: postgresql+psycopg://nexus_owner:owner_pw@localhost/nexus_test
          TEST_PG_ADMIN_URL: postgresql+psycopg://nexus_owner:owner_pw@localhost/nexus_test
          TEST_PG_APP_URL: postgresql+psycopg://nexus_app:app_pw@localhost/nexus_test
        run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
